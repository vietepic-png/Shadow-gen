<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Generator</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><strong>Shadow Generator</strong><div><button id="open-btn">Open PNG</button><button id="export-btn">Export PNG</button><input id="file-input" type="file" accept="image/png" hidden></div></header><main><section class="canvas-panel"><div class="toolbar"><button class="tool-button active" title="Select">Select</button><button class="tool-button" title="Polygon selection">Polygon</button><button class="tool-button" title="Brush">Brush</button><button class="tool-button" title="Erase">Erase</button><span id="canvas-size">No image</span><span id="zoom-level">100%</span></div><div id="canvas-stage"><div id="empty-state"><h2>Open a tilemap PNG</h2><p>Import an image to select objects and generate shadows.</p><button id="empty-open-btn">Choose PNG</button></div><canvas id="map-canvas" hidden></canvas></div><footer><span>Drag to pan · Scroll to zoom</span><span id="cursor-position">X: — Y: —</span></footer></section><aside><section class="panel"><h3>Shadow Settings</h3><label>Sun angle <output id="sun-angle-value">135°</output><input id="sun-angle" type="range" min="0" max="360" value="135"></label><label>Shadow length <output id="shadow-length-value">80 px</output><input id="shadow-length" type="range" min="0" max="200" value="80"></label><label>Object height <output id="object-height-value">32 px</output><input id="object-height" type="range" min="1" max="256" value="32"></label><label>Opacity <output id="opacity-value">35%</output><input id="opacity" type="range" min="0" max="100" value="35"></label><label>Blur <output id="blur-value">1 px</output><input id="blur" type="range" min="0" max="20" value="1"></label><label>Shadow color <input id="shadow-color" type="color" value="#252535"></label><label class="toggle">Contact shadow <input id="contact-shadow" type="checkbox" checked></label></section><section class="panel"><h3>Day / Night</h3><label>Time <output id="time-value">12:00</output><input id="time-of-day" type="range" min="0" max="1440" step="10" value="720"></label><div class="presets"><button class="preset-button" data-time="360">Dawn</button><button class="preset-button" data-time="720">Noon</button><button class="preset-button" data-time="1080">Sunset</button><button class="preset-button" data-time="0">Night</button></div></section><section class="panel"><h3>Objects</h3><div id="object-list"><div class="object-empty">No objects selected</div></div><button id="select-object-btn">Select object</button><button id="clear-selection-btn">Clear</button></section></aside></main><footer class="statusbar"><span class="status-dot"></span><span>Ready</span><span>PNG · Local processing</span></footer></div><script src="shadow.js"></script><script src="app.js"></script></body></html>
